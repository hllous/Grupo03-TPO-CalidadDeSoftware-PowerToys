name: Build & Deploy Backend (Production)

# Se ejecuta en cada push a main o manualmente desde la pestaña Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # El build no comienza hasta que todos los tests pasen
  test:
    name: CI - Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --configuration Release --verbosity normal

  build:
    name: CI - Build
    needs: test
    runs-on: windows-latest
    outputs:
      artifact-name: backend-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: ./publish
          if-no-files-found: error

  deploy:
    name: CD - Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # Variables de entorno para identificar los recursos de AWS
    env:
      AWS_REGION: us-east-1
      S3_BUCKET: powertoys-backend-prod
      EB_APPLICATION: powertoys-backend
      EB_ENVIRONMENT: powertoys-backend-prod
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app
          path: ./publish

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package application
        run: |
          cd ./publish
          zip -r ../app-${{ github.sha }}.zip .

      - name: Upload package to S3
        run: |
          aws s3 cp ./app-${{ github.sha }}.zip s3://${{ env.S3_BUCKET }}/releases/app-${{ github.sha }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION }}" \
            --version-label "v-${{ github.sha }}" \
            --source-bundle S3Bucket="${{ env.S3_BUCKET }}",S3Key="releases/app-${{ github.sha }}.zip"

      - name: Deploy to Elastic Beanstalk environment
        id: deploy
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "${{ env.EB_APPLICATION }}" \
            --environment-name "${{ env.EB_ENVIRONMENT }}" \
            --version-label "v-${{ github.sha }}"

      - name: Wait for deployment to complete
        id: wait
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name "${{ env.EB_APPLICATION }}" \
            --environment-names "${{ env.EB_ENVIRONMENT }}"

      # Si el deploy o la espera fallan, se vuelve a la versión anterior
      - name: Rollback on failure
        if: failure() && (steps.deploy.conclusion == 'failure' || steps.wait.conclusion == 'failure')
        run: |
          PREVIOUS_VERSION=$(aws elasticbeanstalk describe-environments \
            --application-name "${{ env.EB_APPLICATION }}" \
            --environment-names "${{ env.EB_ENVIRONMENT }}" \
            --query "Environments[0].VersionLabel" \
            --output text)
          echo "Deployment failed. Rolling back to $PREVIOUS_VERSION..."
          aws elasticbeanstalk update-environment \
            --application-name "${{ env.EB_APPLICATION }}" \
            --environment-name "${{ env.EB_ENVIRONMENT }}" \
            --version-label "$PREVIOUS_VERSION"
          echo "Rollback to $PREVIOUS_VERSION completed."

      - name: Deployment summary
        run: |
          echo "Deployed version v-${{ github.sha }} to ${{ env.EB_ENVIRONMENT }} (${{ env.AWS_REGION }})"
